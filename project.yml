name: Scoreboard
options:
  bundleIdPrefix: com.paul
  deploymentTarget:
    iOS: "17.0"
targets:
  Scoreboard:
    type: application
    platform: iOS
    sources: [Scoreboard]
    scheme: {}
    info:
      path: Scoreboard/Info.plist
      properties:
        CFBundleDisplayName: Scoreboard
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "Connects to the scoreboard over Bluetooth."
        UIBackgroundModes: [bluetooth-central]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paul.scoreboard
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
